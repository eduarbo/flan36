amily="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Body corners: TL / BL / BR R1.20, TR R2.40.</text><text x="425" y="531" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Four complementary color volumes, flush at the face.</text><text x="425" y="560" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">All paths and colors come directly from master.json.</text><text x="425" y="639" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#253936">PALETTE</text><rect x="425" y="666" width="21" height="21" rx="3" fill="#C5BDA5" stroke="#ABB4AA"/><text x="455" y="684" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#C5BDA5</text><rect x="695" y="666" width="21" height="21" rx="3" fill="#35413D" stroke="#ABB4AA"/><text x="725" y="684" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#35413D</text><rect x="425" y="696" width="21" height="21" rx="3" fill="#D16F3D" stroke="#ABB4AA"/><text x="455" y="714" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#D16F3D</text><rect x="695" y="696" width="21" height="21" rx="3" fill="#EAE4CF" stroke="#ABB4AA"/><text x="725" y="714" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#EAE4CF</text><text x="40" y="845" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#253936">PROPOSED / NOT APPROVED / NOT A PRINT RELEASE</text><text x="40" y="881" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">0.4 mm nozzle target. Exact paths do not qualify slicing, thin tips, bonding or physical fit.</text><text x="40" y="914" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Display context uses real modeled footprints. LCD content is illustrative.</text><text x="40" y="1004" font-family="Arial,sans-serif" font-size="13" font-weight=