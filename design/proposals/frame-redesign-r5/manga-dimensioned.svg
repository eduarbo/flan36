5 52.35 A 0.4 0.4 0 1 1 9.65 52.35 Z " fill="#F0EADB" fill-rule="evenodd" id="manga-Tone30"/><path d="M 10.95 52.35 A 0.4 0.4 0 1 1 11.75 52.35 A 0.4 0.4 0 1 1 10.95 52.35 Z " fill="#F0EADB" fill-rule="evenodd" id="manga-Tone31"/><path d="M 9.65 53.65 A 0.4 0.4 0 1 1 10.45 53.65 A 0.4 0.4 0 1 1 9.65 53.65 Z " fill="#F0EADB" fill-rule="evenodd" id="manga-Tone32"/><path d="M 10.95 53.65 A 0.4 0.4 0 1 1 11.75 53.65 A 0.4 0.4 0 1 1 10.95 53.65 Z " fill="#F0EADB" fill-rule="evenodd" id="manga-Tone33"/><path d="M 16.35 49.45 L 22.45 51.35 L 22.45 54.8 L 16.35 54.8 Z " fill="#DA453D" fill-rule="evenodd" id="manga-RedCorner"/></g><path d="M85 130H349 M62 153V769" stroke="#647D74" fill="none"/><text x="170" y="119" font-family="Arial,sans-serif" font-size="17" fill="#263937" >24.00 mm</text><text x="7" y="470" font-family="Arial,sans-serif" font-size="16" fill="#263937" >56.00</text><text x="425" y="150" font-family="Arial,sans-serif" font-size="19" fill="#263937" font-weight="bold">DESIGN</text><text x="425" y="183" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Full ink panels separated by deliberate diagonal gutters, four dotted discs,</text><text x="425" y="210" font-family="Arial,sans-serif" font-size="17" fill="#263937" >and a red corner. The screen edge stays dark.</text><text x="425" y="287" font-family="Arial,sans-serif" font-size="19" fill="#263937" font-weight="bold">SOURCE GEOMETRY</text><text x="425" y="324" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Origin: top-left; X right / Y down.</text><text x="425" y="353" font-family="Arial,sans-serif" font-size="17" fill="#263937" >All paths, Bézier controls and circular arcs are in master.json.</text><text x="425" y="382" font-family="Arial,sans-serif" font-size="17" fill="#263937" >The 1:1 SVG uses those exact paths and HEX colors.</text><text x="425" y="411" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Painter order is explicit; no scaling or tracing at CAD transfer.</text><text x="425" y="440" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Body corners: TL / BL / BR R1.20; TR R2.40.</text><text x="425" y="469" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Frame face: Z13.59. Glass top: Z13.39.</text><text x="425" y="498" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Artwork depth: 0.40 mm; display collar: through-color.</text><text x="425" y="567" font-family="Arial,sans-serif" font-size="19" fill="#263937" font-weight="bold">PALETTE</text><rect x="425" y="591" width="25" height="25" rx="3" fill="#F0EADB" stroke="#ABB5AE"/><text x="465" y="611" font-family="Arial,sans-serif" font-size="18" fill="#263937" >body  #F0EADB</text><rect x="425" y="626" width="25" height="25" rx="3" fill="#27282E" stroke="#ABB5AE"/><text x="465" y="646" font-family="Arial,sans-serif" font-size="18" fill="#263937" >detail  #27282E</text><rect x="425" y="661" width="25" height="25" rx="3" fill="#DA453D" stroke="#ABB5AE"/><text x="465" y="681" font-family="Arial,sans-serif" font-size="18" fill="#263937" >accent  #DA453D</text><rect x="425" y="696" width="25" height="25" rx="3" fill="#F0EADB" stroke="#ABB5AE"/><text x="465" y="716" font-family="Arial,sans-serif" font-size="18" fill="#263937" >secondary  #F0EADB</text><text x="40" y="830" font-family="Arial,sans-serif" font-size="20" fill="#263937" font-weight="bold">PROPOSAL / NOT APPROVED</text><text x="40" y="866" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Display shown from actual component footprints. No fictitious dark fill behind the aperture.</text><text x="40" y="900" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Exact artwork does not qualify extrusion widths, material bonding or the physical assembly.</text><text x="40" y="960" font-family="Arial,sans-serif" font-size="12" fill="#263937" >MASTER ef2bbd11dba76ecdcf68a31284468425ea415cd912505cd718164ec237a06a01</text></svg>
