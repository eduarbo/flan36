se exact paths and HEX colors.</text><text x="425" y="411" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Painter order is explicit; no scaling or tracing at CAD transfer.</text><text x="425" y="440" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Body corners: TL / BL / BR R1.20; TR R2.40.</text><text x="425" y="469" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Frame face: Z13.59. Glass top: Z13.39.</text><text x="425" y="498" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Artwork depth: 0.40 mm; display collar: through-color.</text><text x="425" y="567" font-family="Arial,sans-serif" font-size="19" fill="#263937" font-weight="bold">PALETTE</text><rect x="425" y="591" width="25" height="25" rx="3" fill="#E4B54B" stroke="#ABB5AE"/><text x="465" y="611" font-family="Arial,sans-serif" font-size="18" fill="#263937" >body  #E4B54B</text><rect x="425" y="626" width="25" height="25" rx="3" fill="#192D3B" stroke="#ABB5AE"/><text x="465" y="646" font-family="Arial,sans-serif" font-size="18" fill="#263937" >detail  #192D3B</text><rect x="425" y="661" width="25" height="25" rx="3" fill="#275273" stroke="#ABB5AE"/><text x="465" y="681" font-family="Arial,sans-serif" font-size="18" fill="#263937" >accent  #275273</text><rect x="425" y="696" width="25" height="25" rx="3" fill="#ACBCC0" stroke="#ABB5AE"/><text x="465" y="716" font-family="Arial,sans-serif" font-size="18" fill="#263937" >secondary  #ACBCC0</text><text x="40" y="830" font-family="Arial,sans-serif" font-size="20" fill="#263937" font-weight="bold">PROPOSAL / NOT APPROVED</text><text x="40" y="866" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Display shown from actual component footprints. No fictitious dark fill behind the aperture.</text><text x="40" y="900" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Exact artwork does not qualify extrusion widths, material bonding or the physical assembly.</text><text x="40" y="960" font-family="Arial,sans-serif" font-size="12" fill="#263937" >MASTER ef2bbd11dba76ecdcf68a31284468425ea415cd912505cd718164ec237a06a01</text></svg>
