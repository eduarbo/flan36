<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1000" viewBox="0 0 1300 1000"><metadata>Flan36 R5 proposal, not approved. Master SHA256 ef2bbd11dba76ecdcf68a31284468425ea415cd912505cd718164ec237a06a01</metadata><rect width="1300" height="1000" fill="#F6F5F0"/><text x="40" y="46" font-family="Arial,sans-serif" font-size="27" fill="#263937" font-weight="bold">TAPE / EXACT APPROVAL ARTWORK</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="18" fill="#263937" >24 × 56 mm · four material roles · all artwork flush · no gradients</text><g transform="translate(85,153) scale(11)"><path d="M 5 5.1 L 19 5.1 L 19 41.1 L 5 41.1 Z " fill="#0B0C0E" fill-rule="evenodd" /><path d="M 5.15 7.65 L 18.85 7.65 L 18.85 37.95 L 5.15 37.95 Z " fill="#303836" fill-rule="evenodd" /><path d="M 5.9 8.4 L 18.1 8.4 L 18.1 37.2 L 5.9 37.2 Z " fill="#BEC8AD" fill-rule="evenodd" /><g fill="#515B47" font-family="monospace" font-size="1.55" text-anchor="middle"><text x="12" y="19">BASE</text><text x="12" y="25">BLE</text></g><path d="M 1.2 0 L 21.6 0 A 2.4 2.4 0 0 1 24 2.4 L 24 54.8 A 1.2 1.2 0 0 1 22.8 56 L 1.2 56 A 1.2 1.2 0 0 1 0 54.8 L 0 1.2 A 1.2 1.2 0 0 1 1.2 0 Z  M 5.05 7.55 L 18.95 7.55 L 18.95 38.05 L 5.05 38.05 Z " fill="#D2CEC1" fill-rule="evenodd" id="tape-body"/><path d="M 5.05 5.15 L 18.95 5.15 A 2.4 2.4 0 0 1 21.35 7.55 L 21.35 38.05 A 2.4 2.4 0 0 1 18.95 40.45 L 5.05 40.45 A 2.4 2.4 0 0 1 2.65 38.05 L 2.65 7.55 A 2.4 2.4 0 0 1 5.05 5.15 Z  M 5.05 7.55 L 18.95 7.55 L 18.95 38.05 L 5.05 38.05 Z " fill="#303738" fill-rule="evenodd" id="tape-ScreenField"/><path d="M 13.6 1.25 L 16.1 1.25 L 19.4 4.05 L 16.9 4.05 Z " fill="#E27136" fill-rule="evenodd" id="tape-OrangeHeader"/><path d="M 17.3 1.25 L 21.65 1.25 L 21.65 4.05 L 20.6 4.05 Z " fill="#303738" fill-rule="evenodd" id="tape-GraphiteHeader"/><path d="M 2.65 38.05 L 21.35 38.05 A 2.4 2.4 0 0 1 18.95 40.45 L 5.05 40.45 A 2.4 2.4 0 0 1 2.65 38.05 Z " fill="#E27136" fill-rule="evenodd" id="tape-ScreenBaseline"/><path d="M 6 44.7 L 18 44.7 L 18 46.3 L 6 46.3 Z " fill="#303738" fill-rule="evenodd" id="tape-TapeBridge"/><path d="M 3.1 45.5 A 2.9 2.9 0 1 1 8.9 45.5 A 2.9 2.9 0 1 1 3.1 45.5 Z " fill="#303738" fill-rule="evenodd" id="tape-SpoolRim0"/><path d="M 3.7 45.5 A 2.3 2.3 0 1 1 8.3 45.5 A 2.3 2.3 0 1 1 3.7 45.5 Z " fill="#F0E9D6" fill-rule="evenodd" id="tape-Spool0"/><path d="M 5.6 44.35 L 6.4 44.35 L 6.4 45.1 L 7.15 45.1 L 7.15 45.9 L 6.4 45.9 L 6.4 46.65 L 5.6 46.65 L 5.6 45.9 L 4.85 45.9 L 4.85 45.1 L 5.6 45.1 Z " fill="#303738" fill-rule="evenodd" id="tape-Hub0"/><path d="M 15.1 45.5 A 2.9 2.9 0 1 1 20.9 45.5 A 2.9 2.9 0 1 1 15.1 45.5 Z " fill="#303738" fill-rule="evenodd" id="tape-SpoolRim1"/><path d="M 15.7 45.5 A 2.3 2.3 0 1 1 20.3 45.5 A 2.3 2.3 0 1 1 15.7 45.5 Z " fill="#F0E9D6" fill-rule="evenodd" id="tape-Spool1"/><path d="M 17.6 44.35 L 18.4 44.35 L 18.4 45.1 L 19.15 45.1 L 19.15 45.9 L 18.4 45.9 L 18.4 46.65 L 17.6 46.65 L 17.6 45.9 L 16.85 45.9 L 16.85 45.1 L 17.6 45.1 Z " fill="#303738" fill-rule="evenodd" id="tape-Hub1"/><path d="M 4.65 49.9 L 19.35 49.9 A 0.45 0.45 0 0 1 19.8 50.35 L 19.8 50.35 A 0.45 0.45 0 0 1 19.35 50.8 L 4.65 50.8 A 0.45 0.45 0 0 1 4.2 50.35 L 4.2 50.35 A 0.45 0.45 0 0 1 4.65 49.9 Z " fill="#303738" fill-rule="evenodd" id="tape-Speaker0"/><path d="M 4.65 51.7 L 19.35 51.7 A 0.45 0.45 0 0 1 19.8 52.15 L 19.8 52.15 A 0.45 0.45 0 0 1 19.35 52.6 L 4.65 52.6 A 0.45 0.45 0 0 1 4.2 52.15 L 4.2 52.15 A 0.45 0.45 0 0 1 4.65 51.7 Z " fill="#303738" fill-rule="evenodd" id="tape-Speaker1"/><path d="M 4.65 53.5 L 19.35 53.5 A 0.45 0.45 0 0 1 19.8 53.95 L 19.8 53.95 A 0.45 0.45 0 0 1 19.35 54.4 L 4.65 54.4 A 0.45 0.45 0 0 1 4.2 53.95 L 4.2 53.95 A 0.45 0.45 0 0 1 4.65 53.5 Z " fill="#303738" fill-rule="evenodd" id="tape-Speaker2"/></g><path d="M85 130H349 M62 153V769" stroke="#647D74" fill="none"/><text x="170" y="119" font-family="Arial,sans-serif" font-size="17" fill="#263937" >24.00 mm</text><text x="7" y="470" font-family="Arial,sans-serif" font-size="16" fill="#263937" >56.00</text><text x="425" y="150" font-family="Arial,sans-serif" font-size="19" fill="#263937" font-weight="bold">DESIGN</text><text x="425" y="183" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Full diagonal header, orange screen baseline, paired cassette spools and three</text><text x="425" y="210" font-family="Arial,sans-serif" font-size="17" fill="#263937" >equally spaced speaker slats.</text><text x="425" y="287" font-family="Arial,sans-serif" font-size="19" fill="#263937" font-weight="bold">SOURCE GEOMETRY</text><text x="425" y="324" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Origin: top-left; X right / Y down.</text><text x="425" y="353" font-family="Arial,sans-serif" font-size="17" fill="#263937" >All paths, Bézier controls and circular arcs are in master.json.</text><text x="425" y="382" font-family="Arial,sans-serif" font-size="17" fill="#263937" >The 1:1 SVG uses those exact paths and HEX colors.</text><text x="425" y="411" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Painter order is explicit; no scaling or tracing at CAD transfer.</text><text x="425" y="440" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Body corners: TL / BL / BR R1.20; TR R2.40.</text><text x="425" y="469" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Frame face: Z13.59. Glass top: Z13.39.</text><text x="425" y="498" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Artwork depth: 0.40 mm; display collar: through-color.</text><text x="425" y="567" font-family="Arial,sans-serif" font-size="19" fill="#263937" font-weight="bold">PALETTE</text><rect x="425" y="591" width="25" height="25" rx="3" fill="#D2CEC1" stroke="#ABB5AE"/><text x="465" y="611" font-family="Arial,sans-serif" font-size="18" fill="#263937" >body  #D2CEC1</text><rect x="425" y="626" width="25" height="25" rx="3" fill="#303738" stroke="#ABB5AE"/><text x="465" y="646" font-family="Arial,sans-serif" font-size="18" fill="#263937" >detail  #303738</text><rect x="425" y="661" width="25" height="25" rx="3" fill="#E27136" stroke="#ABB5AE"/><text x="465" y="681" font-family="Arial,sans-serif" font-size="18" fill="#263937" >accent  #E27136</text><rect x="425" y="696" width="25" height="25" rx="3" fill="#F0E9D6" stroke="#ABB5AE"/><text x="465" y="716" font-family="Arial,sans-serif" font-size="18" fill="#263937" >secondary  #F0E9D6</text><text x="40" y="830" font-family="Arial,sans-serif" font-size="20" fill="#263937" font-weight="bold">PROPOSAL / NOT APPROVED</text><text x="40" y="866" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Display shown from actual component footprints. No fictitious dark fill behind the aperture.</text><text x="40" y="900" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Exact artwork does not qualify extrusion widths, material bonding or the physical assembly.</text><text x="40" y="960" font-family="Arial,sans-serif" font-size="12" fill="#263937" >MASTER ef2bbd11dba76ecdcf68a31284468425ea415cd912505cd718164ec237a06a01</text></svg>
