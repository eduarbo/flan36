<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1000" viewBox="0 0 1300 1000"><metadata>Flan36 R5 proposal, not approved. Master SHA256 ef2bbd11dba76ecdcf68a31284468425ea415cd912505cd718164ec237a06a01</metadata><rect width="1300" height="1000" fill="#F6F5F0"/><text x="40" y="46" font-family="Arial,sans-serif" font-size="27" fill="#263937" font-weight="bold">ORBIT / EXACT APPROVAL ARTWORK</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="18" fill="#263937" >24 × 56 mm · four material roles · all artwork flush · no gradients</text><g transform="translate(85,153) scale(11)"><path d="M 5 5.1 L 19 5.1 L 19 41.1 L 5 41.1 Z " fill="#0B0C0E" fill-rule="evenodd" /><path d="M 5.15 7.65 L 18.85 7.65 L 18.85 37.95 L 5.15 37.95 Z " fill="#303836" fill-rule="evenodd" /><path d="M 5.9 8.4 L 18.1 8.4 L 18.1 37.2 L 5.9 37.2 Z " fill="#BEC8AD" fill-rule="evenodd" /><g fill="#515B47" font-family="monospace" font-size="1.55" text-anchor="middle"><text x="12" y="19">BASE</text><text x="12" y="25">BLE</text></g><path d="M 1.2 0 L 21.6 0 A 2.4 2.4 0 0 1 24 2.4 L 24 54.8 A 1.2 1.2 0 0 1 22.8 56 L 1.2 56 A 1.2 1.2 0 0 1 0 54.8 L 0 1.2 A 1.2 1.2 0 0 1 1.2 0 Z  M 5.05 7.55 L 18.95 7.55 L 18.95 38.05 L 5.05 38.05 Z " fill="#EEE5CD" fill-rule="evenodd" id="orbit-body"/><path d="M 4.75 2.1 L 19.25 2.1 A 2.4 2.4 0 0 1 21.65 4.5 L 21.65 51.5 A 2.4 2.4 0 0 1 19.25 53.9 L 4.75 53.9 A 2.4 2.4 0 0 1 2.35 51.5 L 2.35 4.5 A 2.4 2.4 0 0 1 4.75 2.1 Z  M 5.05 7.55 L 18.95 7.55 L 18.95 38.05 L 5.05 38.05 Z " fill="#315C4E" fill-rule="evenodd" id="orbit-ForestField"/><path d="M 3.15 31.2 C 3.15 40.6 4.1 50.8 9.4 52.25 C 14.5 53.8 19.2 51.7 20.85 46.7 L 20.85 42.3 C 18.9 47.8 17.3 49.05 15.25 48.35 C 13.9 47.95 14.8 44.1 11.2 44.1 C 8.4 44.1 8.2 47.3 6.95 45.9 C 4.65 43.2 4.2 37.2 3.15 31.2 Z " fill="#DF7339" fill-rule="evenodd" id="orbit-OrbitSweep"/><path d="M 9 48.55 A 2.25 2.25 0 1 1 13.5 48.55 A 2.25 2.25 0 1 1 9 48.55 Z " fill="#EEE5CD" fill-rule="evenodd" id="orbit-IvoryDisc"/><path d="M 11.6 2.85 L 12.4 2.85 L 12.4 3.85 L 13.4 3.85 L 13.4 4.65 L 12.4 4.65 L 12.4 5.65 L 11.6 5.65 L 11.6 4.65 L 10.6 4.65 L 10.6 3.85 L 11.6 3.85 Z " fill="#DF7339" fill-rule="evenodd" id="orbit-Star"/></g><path d="M85 130H349 M62 153V769" stroke="#647D74" fill="none"/><text x="170" y="119" font-family="Arial,sans-serif" font-size="17" fill="#263937" >24.00 mm</text><text x="7" y="470" font-family="Arial,sans-serif" font-size="16" fill="#263937" >56.00</text><text x="425" y="150" font-family="Arial,sans-serif" font-size="19" fill="#263937" font-weight="bold">DESIGN</text><text x="425" y="183" font-family="Arial,sans-serif" font-size="17" fill="#263937" >A continuous forest panel and a long orange orbital sweep. The ivory disc sits</text><text x="425" y="210" font-family="Arial,sans-serif" font-size="17" fill="#263937" >inside the sweep, as in the reference.</text><text x="425" y="287" font-family="Arial,sans-serif" font-size="19" fill="#263937" font-weight="bold">SOURCE GEOMETRY</text><text x="425" y="324" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Origin: top-left; X right / Y down.</text><text x="425" y="353" font-family="Arial,sans-serif" font-size="17" fill="#263937" >All paths, Bézier controls and circular arcs are in master.json.</text><text x="425" y="382" font-family="Arial,sans-serif" font-size="17" fill="#263937" >The 1:1 SVG uses those exact paths and HEX colors.</text><text x="425" y="411" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Painter order is explicit; no scaling or tracing at CAD transfer.</text><text x="425" y="440" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Body corners: TL / BL / BR R1.20; TR R2.40.</text><text x="425" y="469" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Frame face: Z13.59. Glass top: Z13.39.</text><text x="425" y="498" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Artwork depth: 0.40 mm; display collar: through-color.</text><text x="425" y="567" font-family="Arial,sans-serif" font-size="19" fill="#263937" font-weight="bold">PALETTE</text><rect x="425" y="591" width="25" height="25" rx="3" fill="#EEE5CD" stroke="#ABB5AE"/><text x="465" y="611" font-family="Arial,sans-serif" font-size="18" fill="#263937" >body  #EEE5CD</text><rect x="425" y="626" width="25" height="25" rx="3" fill="#315C4E" stroke="#ABB5AE"/><text x="465" y="646" font-family="Arial,sans-serif" font-size="18" fill="#263937" >detail  #315C4E</text><rect x="425" y="661" width="25" height="25" rx="3" fill="#DF7339" stroke="#ABB5AE"/><text x="465" y="681" font-family="Arial,sans-serif" font-size="18" fill="#263937" >accent  #DF7339</text><rect x="425" y="696" width="25" height="25" rx="3" fill="#EEE5CD" stroke="#ABB5AE"/><text x="465" y="716" font-family="Arial,sans-serif" font-size="18" fill="#263937" >secondary  #EEE5CD</text><text x="40" y="830" font-family="Arial,sans-serif" font-size="20" fill="#263937" font-weight="bold">PROPOSAL / NOT APPROVED</text><text x="40" y="866" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Display shown from actual component footprints. No fictitious dark fill behind the aperture.</text><text x="40" y="900" font-family="Arial,sans-serif" font-size="17" fill="#263937" >Exact artwork does not qualify extrusion widths, material bonding or the physical assembly.</text><text x="40" y="960" font-family="Arial,sans-serif" font-size="12" fill="#263937" >MASTER ef2bbd11dba76ecdcf68a31284468425ea415cd912505cd718164ec237a06a01</text></svg>
