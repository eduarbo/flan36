5" y="473" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Screen bezel: exact 2.40 mm outward offset.</text><text x="425" y="502" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Body corners: TL / BL / BR R1.20, TR R2.40.</text><text x="425" y="531" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Four complementary color volumes, flush at the face.</text><text x="425" y="560" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">All paths and colors come directly from master.json.</text><text x="425" y="639" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#253936">PALETTE</text><rect x="425" y="666" width="21" height="21" rx="3" fill="#CBC8BB" stroke="#ABB4AA"/><text x="455" y="684" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#CBC8BB</text><rect x="695" y="666" width="21" height="21" rx="3" fill="#30343B" stroke="#ABB4AA"/><text x="725" y="684" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#30343B</text><rect x="425" y="696" width="21" height="21" rx="3" fill="#B9433C" stroke="#ABB4AA"/><text x="455" y="714" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#B9433C</text><rect x="695" y="696" width="21" height="21" rx="3" fill="#CFA552" stroke="#ABB4AA"/><text x="725" y="714" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#CFA552</text><text x="40" y="845" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#253936">PROPOSED / NOT APPROVED / NOT A PRINT RELEASE</text><text x="40" y="881" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">0.4 mm nozzle target. Exact paths do not qualify slicing, thin tips, bonding or physical fit.</text><text x="40" y="914" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill=