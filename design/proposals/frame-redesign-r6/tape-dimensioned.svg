" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Nominal glass clearance: 0.10 mm on each side.</text><text x="425" y="444" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Frame face: Z13.59 mm. Glass top: Z13.39 mm.</text><text x="425" y="473" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Screen bezel: exact 2.40 mm outward offset.</text><text x="425" y="502" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Body corners: TL / BL / BR R1.20, TR R2.40.</text><text x="425" y="531" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Four complementary color volumes, flush at the face.</text><text x="425" y="560" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">All paths and colors come directly from master.json.</text><text x="425" y="639" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#253936">PALETTE</text><rect x="425" y="666" width="21" height="21" rx="3" fill="#2448A7" stroke="#ABB4AA"/><text x="455" y="684" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#2448A7</text><rect x="695" y="666" width="21" height="21" rx="3" fill="#F6EAD1" stroke="#ABB4AA"/><text x="725" y="684" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#F6EAD1</text><rect x="425" y="696" width="21" height="21" rx="3" fill="#DA4D3D" stroke="#ABB4AA"/><text x="455" y="714" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#DA4D3D</text><rect x="695" y="696" width="21" height="21" rx="3" fill="#182E53" stroke="#ABB4AA"/><text x="725" y="714" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#182E53</text><text x="40" y="845" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#253936">PROPOSED / NOT APPROVED / NOT A PRINT RELEASE