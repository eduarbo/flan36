size="18" font-weight="normal" fill="#253936">Body corners: TL / BL / BR R1.20, TR R2.40.</text><text x="425" y="531" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Four complementary color volumes, flush at the face.</text><text x="425" y="560" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">All paths and colors come directly from master.json.</text><text x="425" y="639" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#253936">PALETTE</text><rect x="425" y="666" width="21" height="21" rx="3" fill="#F1E6CA" stroke="#ABB4AA"/><text x="455" y="684" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#F1E6CA</text><rect x="695" y="666" width="21" height="21" rx="3" fill="#244E91" stroke="#ABB4AA"/><text x="725" y="684" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#244E91</text><rect x="425" y="696" width="21" height="21" rx="3" fill="#C36443" stroke="#ABB4AA"/><text x="455" y="714" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#C36443</text><rect x="695" y="696" width="21" height="21" rx="3" fill="#244E91" stroke="#ABB4AA"/><text x="725" y="714" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#244E91</text><text x="40" y="845" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#253936">SELECTED ARTWORK / NOT A PRINT RELEASE</text><text x="40" y="881" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">0.4 mm nozzle target. Exact paths do not qualify slicing, thin tips, bonding or physical fit.</text><text x="40" y="914" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Display context uses real modeled footprints. LCD content is illustrative.</text><text x="40" y="1004" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#253936">MASTER SHA256