t x="425" y="357" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">The current corrected mechanical blank is unchanged.</text><text x="425" y="386" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Opening: 13.90 × 30.50 mm, centered on the glass.</text><text x="425" y="415" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Nominal glass clearance: 0.10 mm on each side.</text><text x="425" y="444" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Frame face: Z13.59 mm. Glass top: Z13.39 mm.</text><text x="425" y="473" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Screen bezel: exact 2.40 mm outward offset.</text><text x="425" y="502" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Body corners: TL / BL / BR R1.20, TR R2.40.</text><text x="425" y="531" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Four complementary color volumes, flush at the face.</text><text x="425" y="560" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">All paths and colors come directly from master.json.</text><text x="425" y="639" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#253936">PALETTE</text><rect x="425" y="666" width="21" height="21" rx="3" fill="#382D55" stroke="#ABB4AA"/><text x="455" y="684" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#382D55</text><rect x="695" y="666" width="21" height="21" rx="3" fill="#7561A7" stroke="#ABB4AA"/><text x="725" y="684" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#7561A7</text><rect x="425" y="696" width="21" height="21" rx="3" fill="#C7DD58" stroke="#ABB4AA"/><text x="455" y="714" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#C7DD58</text><rect x="695" y="696" width="21" height="21" rx="3" fill="#F0DEBB" stroke="#ABB4AA"/><text x="725" y="714" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#253936">#F0DEBB</text><text x="40" y="845" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#253936">PROPOSED / NOT APPROVED / NOT A PRINT RELEASE</text><text x="40" y="881" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">0.4 mm nozzle target. Exact paths do not qualify slicing, thin tips, bonding or physical fit.</text><text x="40" y="914" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#253936">Display context uses real modeled footprints. LCD content is illustrative.</text><text x="40" y="1004" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#253936">MASTER SHA256 291e9fb40634246b8a4f0733fed7e240ec94295adab2540a9e5445ea9057555e</text></svg>
