"1" fill="none"/><path d="M 258 197.45 L 266 205.45" stroke="#70837D" stroke-width="1" fill="none"/><path d="M 258 223.85 L 266 231.85" stroke="#70837D" stroke-width="1" fill="none"/><text x="284" y="218.5" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >2.40</text><path d="M 262 569.95 L 262 596.35" stroke="#70837D" stroke-width="1" fill="none"/><path d="M 258 565.95 L 266 573.95" stroke="#70837D" stroke-width="1" fill="none"/><path d="M 258 592.35 L 266 600.35" stroke="#70837D" stroke-width="1" fill="none"/><text x="284" y="594.7" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >2.40</text><text x="465" y="150" font-family="Arial, sans-serif" font-size="23" fill="#233D39" font-weight="bold">2.40 mm ON ALL FOUR SIDES</text><text x="465" y="184" font-family="Arial, sans-serif" font-size="18" fill="#233D39" >Outer bezel: 19.30 × 35.90 mm / R2.40</text><text x="465" y="215" font-family="Arial, sans-serif" font-size="18" fill="#233D39" >Aperture: 14.50 × 31.10 mm / square corners</text><text x="465" y="246" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Exact outward offset, including the rounded corners.</text><text x="465" y="292" font-family="Arial, sans-serif" font-size="18" fill="#233D39" font-weight="bold">CENTERED DISPLAY — PROPOSED CHANGE</text><text x="465" y="325" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Center X12.00; exterior side margins 2.35 / 2.35 mm.</text><text x="465" y="356" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Aperture X4.75–19.25 / Y7.35–38.45 mm.</text><text x="465" y="387" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Move display, contacts, relief and PCB header +0.20 mm X.</text><text x="465" y="418" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Mirror on the right. Battery and MCU stay in place.</text><text x="465" y="464" font-family="Arial, sans-serif" font-size="18" fill="#233D39" font-weight="bold">BALANCED FLOWER</text><text x="465" y="497" font-family="Arial, sans-serif" font-size="18" fill="#233D39" >12.40 × 12.40 mm · center X12.00 / Y48.60</text><text x="465" y="528" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Four mirrored cubic petals, with a centered terracotta star.</text><text x="465" y="574" font-family="Arial, sans-serif" font-size="18" fill="#233D39" font-weight="bold">SOLID COLORS / FLUSH SURFACE</text><rect x="465" y="592" width="24" height="24" rx="3" fill="#F1E6CA" stroke="#CACCC4"/><text x="501" y="610" font-family="Arial, sans-serif" font-size="18" fill="#233D39" >Ivory  #F1E6CA</text><rect x="465" y="630" width="24" height="24" rx="3" fill="#244E91" stroke="#CACCC4"/><text x="501" y="648" font-family="Arial, sans-serif" font-size="18" fill="#233D39" >Cobalt  #244E91</text><rect x="465" y="668" width="24" height="24" rx="3" fill="#C36443" stroke="#CACCC4"/><text x="501" y="686" font-family="Arial, sans-serif" font-size="18" fill="#233D39" >Terracotta  #C36443</text><text x="40" y="802" font-family="Arial, sans-serif" font-size="20" fill="#233D39" font-weight="bold">SELECTED: WHOLE FRAME AND MATCHING CASE FACE +0.20 mm</text><text x="40" y="835" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Face Z13.59 · glass Z13.39 · cover 0.40 mm · nominal solder gap 0.20 mm · collar 0.865 mm</text><text x="40" y="865" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >Existing shell corners retained: TL / BL / BR R1.20, TR R2.40. Bezel has its own constant-offset corners.</text><text x="40" y="893" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >Artwork and display centering await approval. Full CAD, PCB and 0.40 mm-nozzle slicing are still pending.</text><text x="40" y="924" font-family="Arial, sans-serif" font-size="13" fill="#233D39" >MASTER 3b6f6da77c9e1edf · HEX colors are digital targets; physical filament matching needs samples.</text></svg>
