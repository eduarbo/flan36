display PCB.</text><text x="70" y="620" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >The line through the cover marks glass top Z13.39 (0.20 mm below the new face).</text><text x="70" y="661" font-family="Arial, sans-serif" font-size="19" fill="#233D39" font-weight="bold">PRINT TARGET: 0.40 mm nozzle / 0.20 mm layers / colored frame face down.</text><text x="70" y="695" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >The cover spans two nominal layers. Nozzle size controls XY extrusion; layer height controls Z.</text><text x="70" y="726" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >This does not certify every wall or tapered motif. Final solids still require slicing and a fit coupon.</text><text x="40" y="785" font-family="Arial, sans-serif" font-size="13" fill="#233D39" >MASTER 3b6f6da77c9e1edf · Z scale 160 px/mm; horizontal section schematic, not an assembly-clearance test.</text></svg>
