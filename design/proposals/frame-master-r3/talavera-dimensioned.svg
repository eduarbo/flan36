 >Existing rectangular opening preserved.</text><path d="M 339.55 367 L 445 218" stroke="#70837D" stroke-width="1" fill="none"/><text x="465" y="279" font-family="Arial, sans-serif" font-size="18" fill="#233D39" font-weight="bold">COBALT TO THE OPENING</text><text x="465" y="308" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >No ivory strip between blue and aperture.</text><text x="465" y="335" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Through-color collar: A 0.665 / B 0.865 mm.</text><path d="M 355.5 488 L 445 322" stroke="#70837D" stroke-width="1" fill="none"/><text x="465" y="390" font-family="Arial, sans-serif" font-size="18" fill="#233D39" font-weight="bold">FOUR MIRRORED PETALS</text><text x="465" y="419" font-family="Arial, sans-serif" font-size="20" fill="#233D39" >11.60 × 11.60 mm motif envelope</text><text x="465" y="448" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >5.10 mm petal width; unscaled cubic curves.</text><text x="465" y="477" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Center: X 12.00 / Y 49.00 mm</text><text x="465" y="506" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Compact square motif fits the real lower space.</text><path d="M 325.8 675 L 445 462" stroke="#70837D" stroke-width="1" fill="none"/><text x="465" y="558" font-family="Arial, sans-serif" font-size="18" fill="#233D39" font-weight="bold">SOLID MATERIAL COLORS</text><rect x="465" y="572" width="24" height="24" rx="3" fill="#F1E6CA" stroke="#CACCC4"/><text x="501" y="590" font-family="Arial, sans-serif" font-size="18" fill="#233D39" >Ivory  #F1E6CA</text><rect x="465" y="610" width="24" height="24" rx="3" fill="#244E91" stroke="#CACCC4"/><text x="501" y="628" font-family="Arial, sans-serif" font-size="18" fill="#233D39" >Cobalt  #244E91</text><rect x="465" y="648" width="24" height="24" rx="3" fill="#C36443" stroke="#CACCC4"/><text x="501" y="666" font-family="Arial, sans-serif" font-size="18" fill="#233D39" >Terracotta  #C36443</text><text x="920" y="145" font-family="Arial, sans-serif" font-size="18" fill="#233D39" font-weight="bold">OUTLINE RADII</text><text x="920" y="180" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >TL / BL / BR: R1.20</text><text x="920" y="208" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >TR: R2.40</text><text x="920" y="244" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >Taken from existing CAD;</text><text x="920" y="269" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >not symmetrized silently.</text><text x="920" y="332" font-family="Arial, sans-serif" font-size="18" fill="#233D39" font-weight="bold">1:1 MASTER</text><text x="920" y="365" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >Origin: top-left envelope</text><text x="920" y="392" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >X right / Y down / mm</text><text x="920" y="438" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >Same path coordinates</text><text x="920" y="465" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >feed SVG and future CAD.</text><text x="40" y="811" font-family="Arial, sans-serif" font-size="19" fill="#233D39" font-weight="bold">CONSTRUCTION IS NOT YET APPROVED</text><text x="40" y="843" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Pin-cover A: 0.20 mm skin, unchanged face height. B: 0.40 mm skin, face +0.20 mm. See section.svg.</text><text x="40" y="873" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Both leave 0.20 mm above the nominal solder reserve. Physical solder and print integrity remain unqualified.</text><text x="40" y="905" font-family="Arial, sans-serif" font-size="14" fill="#233D39" >MASTER 3e74ccf87921e932 · HEX values specify digital colors; filament matching requires physical samples.</text></svg>
