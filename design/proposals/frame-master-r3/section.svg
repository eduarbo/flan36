" font-size="18" fill="#233D39" >Cover 0.20 mm + nominal gap 0.20 mm</text><text x="55" y="262" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Glass top stays at Z 13.39 mm.</text><text x="55" y="610" font-family="Arial, sans-serif" font-size="15" fill="#233D39" >Blue: cover / gray: solder reserve / green: PCB</text><text x="55" y="640" font-family="Arial, sans-serif" font-size="14" fill="#233D39" >Illustrated solder shapes are an envelope, not measured joints.</text><text x="680" y="135" font-family="Arial, sans-serif" font-size="23" fill="#233D39" font-weight="bold">OPTION B</text><text x="680" y="166" font-family="Arial, sans-serif" font-size="19" fill="#233D39" >+0.20 mm face / thicker cover</text><rect x="695" y="327.0499999999999" width="330" height="62.0" fill="#244E91"/><rect x="695" y="497.54999999999984" width="330" height="77.5" fill="#628975"/><rect x="718" y="420.04999999999984" width="32" height="77.5" fill="#A9AFB1"/><rect x="781" y="420.04999999999984" width="32" height="77.5" fill="#A9AFB1"/><rect x="844" y="420.04999999999984" width="32" height="77.5" fill="#A9AFB1"/><rect x="907" y="420.04999999999984" width="32" height="77.5" fill="#A9AFB1"/><rect x="970" y="420.04999999999984" width="32" height="77.5" fill="#A9AFB1"/><path d="M 695 358.0499999999998 L 1050 358.0499999999998" stroke="#B66A47" stroke-width="1" fill="none"/><text x="1045" y="332.0499999999999" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >Z 13.59</text><text x="1045" y="394.04999999999995" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >Z 13.19</text><text x="1045" y="425.04999999999984" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >Z 12.99</text><text x="1045" y="502.54999999999984" font-family="Arial, sans-serif" font-size="16" fill="#233D39" >Z 12.49</text><text x="680" y="235" font-family="Arial, sans-serif" font-size="18" fill="#233D39" >Cover 0.40 mm + nominal gap 0.20 mm</text><text x="680" y="262" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Glass top stays at Z 13.39 mm.</text><text x="680" y="610" font-family="Arial, sans-serif" font-size="15" fill="#233D39" >Blue: cover / gray: solder reserve / green: PCB</text><text x="680" y="640" font-family="Arial, sans-serif" font-size="14" fill="#233D39" >Illustrated solder shapes are an envelope, not measured joints.</text><text x="40" y="704" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >COMMON XY: header well X 4.95–18.65 / Y 38.10–41.60 mm. Aperture subtraction removes Y &lt; 38.45.</text><text x="40" y="738" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >A is an experimental thin skin. B changes frame height and needs the matching case adjustment to stay level.</text><text x="40" y="772" font-family="Arial, sans-serif" font-size="17" fill="#233D39" >Neither option changes the battery/MCU/display positions. No cover has been selected or implemented.</text><text x="40" y="813" font-family="Arial, sans-serif" font-size="14" fill="#233D39" >MASTER 3e74ccf87921e932 · Drawing vertical scale is 155 px/mm; horizontal schematic is not a clearance model.</text></svg>
